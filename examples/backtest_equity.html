<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICT Scanner — Backtest (synthetic)</title>
<style>
  :root { --bg:#f7f8fa; --panel:#fff; --fg:#1a2027; --muted:#5b6672;
    --line:#e3e7ec; --border:#d7dde3; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0e1116; --panel:#161b22; --fg:#e6edf3; --muted:#8b949e;
    --line:#222c37; --border:#2a333d; } }
  :root[data-theme="dark"] { --bg:#0e1116; --panel:#161b22; --fg:#e6edf3;
    --muted:#8b949e; --line:#222c37; --border:#2a333d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:940px; margin:0 auto; padding:22px 18px 32px; }
  h1 { font-size:16px; margin:0 0 14px; font-weight:600; }
  .stats { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .stat { background:var(--panel); border:1px solid var(--border);
    border-radius:9px; padding:10px 14px; min-width:92px; }
  .stat .v { font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; }
  .stat .k { font-size:11px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.06em; margin-top:2px; }
  svg.chart { width:100%; height:auto; background:var(--panel);
    border:1px solid var(--border); border-radius:10px; }
  .gridline { stroke:var(--line); stroke-width:0.6; }
  text.axis { fill:var(--muted); font-size:10px; font-variant-numeric:tabular-nums; }
  text.sig { font-size:13px; font-weight:700; }
  footer { color:var(--muted); font-size:11px; margin-top:14px; }
</style></head><body>
<div class="wrap">
  <h1>ICT Scanner — Backtest (synthetic)</h1>
  <div class="stats"><div class="stat"><div class="v">6</div><div class="k">trades</div></div><div class="stat"><div class="v">33%</div><div class="k">win rate</div></div><div class="stat"><div class="v">-2.00R</div><div class="k">total</div></div><div class="stat"><div class="v">-0.33R</div><div class="k">expectancy</div></div><div class="stat"><div class="v">0.5</div><div class="k">profit factor</div></div><div class="stat"><div class="v">3.00R</div><div class="k">max DD</div></div></div>
  <svg viewBox="0 0 900 380" class="chart" role="img" aria-label="ICT Scanner — Backtest (synthetic) equity curve">
<line x1="54.0" y1="346.0" x2="880.0" y2="346.0" class="gridline"/>
<text x="48.0" y="349.0" class="axis" text-anchor="end">-2.0R</text>
<line x1="54.0" y1="264.5" x2="880.0" y2="264.5" class="gridline"/>
<text x="48.0" y="267.5" class="axis" text-anchor="end">-1.2R</text>
<line x1="54.0" y1="183.0" x2="880.0" y2="183.0" class="gridline"/>
<text x="48.0" y="186.0" class="axis" text-anchor="end">-0.5R</text>
<line x1="54.0" y1="101.5" x2="880.0" y2="101.5" class="gridline"/>
<text x="48.0" y="104.5" class="axis" text-anchor="end">0.2R</text>
<line x1="54.0" y1="20.0" x2="880.0" y2="20.0" class="gridline"/>
<text x="48.0" y="23.0" class="axis" text-anchor="end">1.0R</text>
<line x1="54.0" y1="128.7" x2="880.0" y2="128.7" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 3"/>
<polyline points="54.0,128.7 54.0,20.0 219.2,128.7 384.4,20.0 549.6,128.7 714.8,237.3 880.0,346.0 880.0,128.7" fill="#ef5350" fill-opacity="0.10" stroke="none"/>
<polyline points="54.0,20.0 219.2,128.7 384.4,20.0 549.6,128.7 714.8,237.3 880.0,346.0" fill="none" stroke="#ef5350" stroke-width="2"/>
<circle cx="54.0" cy="20.0" r="2.6" fill="#ef5350"><title>trade 1: 1.00R cumulative</title></circle>
<circle cx="219.2" cy="128.7" r="2.6" fill="#ef5350"><title>trade 2: 0.00R cumulative</title></circle>
<circle cx="384.4" cy="20.0" r="2.6" fill="#ef5350"><title>trade 3: 1.00R cumulative</title></circle>
<circle cx="549.6" cy="128.7" r="2.6" fill="#ef5350"><title>trade 4: 0.00R cumulative</title></circle>
<circle cx="714.8" cy="237.3" r="2.6" fill="#ef5350"><title>trade 5: -1.00R cumulative</title></circle>
<circle cx="880.0" cy="346.0" r="2.6" fill="#ef5350"><title>trade 6: -2.00R cumulative</title></circle>
<text x="880.0" y="338.0" class="sig" fill="#ef5350" text-anchor="end">-2.00R</text>
</svg>
  <footer>Cumulative R across closed trades. Walk-forward, no lookahead.
  Educational — not financial advice.</footer>
</div></body></html>
